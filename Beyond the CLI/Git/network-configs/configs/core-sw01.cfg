! core-sw01 - Core Switch 01
! Site: London DC
!
hostname core-sw01
!
vlan 10
 name MANAGEMENT
vlan 20
 name SERVERS
vlan 30
 name USERS
vlan 40
 name GUEST_WIFI
!
interface Vlan10
 description Management VLAN
 ip address 10.0.10.1 255.255.255.0
!
interface Vlan20
 description Server VLAN
 ip address 10.0.20.1 255.255.255.0
!
interface Vlan30
 description User VLAN
 ip address 10.0.30.1 255.255.255.0
!
interface vlan40
 description Guest WiFi VLAN
 ip address 10.0.40.1 255.255.255.0
!
ip default-gateway 10.0.10.254
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
!
end
