! QoS Policy - Core Network
!
class-map match-any VOICE
 match dscp ef
 match dscp cs5
!
class-map match-any VIDEO
 match dscp af41
 match dscp cs4
!
class-map match-any NETWORK-CONTROL
 match dscp cs6
 match dscp cs7
!
policy-map WAN-EDGE-OUT
 class VOICE
  priority percent 10
 class VIDEO
  bandwidth percent 30
 class NETWORK-CONTROL
  bandwidth percent 5
 class class-default
  bandwidth percent 55
  random-detect
!
